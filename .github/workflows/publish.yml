name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read release metadata
        id: meta
        shell: pwsh
        run: |
          $properties = @{}
          Get-Content 'gradle.properties' | ForEach-Object {
            if ($_ -match '^\s*([^#=\s]+)=(.*)$') {
              $properties[$matches[1]] = $matches[2].Trim()
            }
          }

          $modVersion = $properties['mod_version']
          $minecraftVersion = $properties['minecraft_version']
          if (-not $modVersion) {
            throw 'mod_version is missing in gradle.properties'
          }
          if (-not $minecraftVersion) {
            throw 'minecraft_version is missing in gradle.properties'
          }

          if ('${{ github.event_name }}' -eq 'push') {
            $releaseTag = '${{ github.ref_name }}'
            $releaseVersion = if ($releaseTag.StartsWith('v')) { $releaseTag.Substring(1) } else { $releaseTag }
            if ($releaseVersion -ne $modVersion) {
              throw "Tag '$releaseTag' does not match mod_version '$modVersion'"
            }
          } else {
            $releaseVersion = $modVersion
            $releaseTag = "v$releaseVersion"
          }

          if ($releaseVersion -match '(?i)alpha') {
            $releaseType = 'alpha'
          } elseif ($releaseVersion -match '(?i)(beta|rc|pre)') {
            $releaseType = 'beta'
          } else {
            $releaseType = 'release'
          }

          $releaseName = "FindAnyway $releaseVersion for Minecraft $minecraftVersion"

          "mod_version=$modVersion" >> $env:GITHUB_OUTPUT
          "minecraft_version=$minecraftVersion" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "release_type=$releaseType" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT

      - name: Validate publish configuration
        id: publish_config
        shell: pwsh
        env:
          CURSEFORGE_TOKEN_PRIMARY: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_TOKEN_FALLBACK: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID_PRIMARY: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID_FALLBACK: ${{ secrets.CURSEFORGE_PROJECT_ID }}
        run: |
          $token = if ($env:CURSEFORGE_TOKEN_PRIMARY) {
            $env:CURSEFORGE_TOKEN_PRIMARY
          } elseif ($env:CURSEFORGE_TOKEN_FALLBACK) {
            $env:CURSEFORGE_TOKEN_FALLBACK
          } else {
            $null
          }

          $projectId = if ($env:CURSEFORGE_PROJECT_ID_PRIMARY) {
            $env:CURSEFORGE_PROJECT_ID_PRIMARY
          } elseif ($env:CURSEFORGE_PROJECT_ID_FALLBACK) {
            $env:CURSEFORGE_PROJECT_ID_FALLBACK
          } else {
            $null
          }

          if (-not $token) {
            throw 'Missing CurseForge token. Expected CURSEFORGE_TOKEN or CURSEFORGE_API_TOKEN.'
          }

          if (-not $projectId) {
            throw 'Missing CurseForge project id. Expected CURSEFORGE_PROJECT_ID as repository variable or secret.'
          }

          Write-Output "::add-mask::$token"
          "curseforge_token=$token" >> $env:GITHUB_OUTPUT
          "curseforge_project_id=$projectId" >> $env:GITHUB_OUTPUT

      - name: Build release artifact
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Generate changelog
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
          MINECRAFT_VERSION: ${{ steps.meta.outputs.minecraft_version }}
        run: |
          New-Item -ItemType Directory -Force 'build' | Out-Null

          $previousTag = git tag --sort=-creatordate | Where-Object { $_ -ne $env:RELEASE_TAG } | Select-Object -First 1
          $range = if ($previousTag) { "$previousTag..HEAD" } else { 'HEAD' }
          $entries = @(git log $range --pretty=format:'- %s')
          if ($entries.Count -eq 0) {
            $entries = @('- Automated release build.')
          }

          $lines = @(
            "# FindAnyway $($env:RELEASE_VERSION)",
            '',
            "Minecraft: $($env:MINECRAFT_VERSION)",
            '',
            '## Changes',
            ''
          ) + $entries

          Set-Content -Path 'build/CHANGELOG.md' -Value $lines -Encoding UTF8

      - name: Publish to CurseForge and GitHub Releases
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ steps.publish_config.outputs.curseforge_project_id }}
          curseforge-token: ${{ steps.publish_config.outputs.curseforge_token }}
          github-tag: ${{ steps.meta.outputs.release_tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: false
          name: ${{ steps.meta.outputs.release_name }}
          version: ${{ steps.meta.outputs.release_version }}
          version-type: ${{ steps.meta.outputs.release_type }}
          changelog-file: build/CHANGELOG.md
          loaders: |
            neoforge
          game-versions: |
            ${{ steps.meta.outputs.minecraft_version }}
          java: |
            21
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
          fail-mode: fail